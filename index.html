<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aplikasi GMP</title>
<meta name="description" content="Sistem kerja & blueprint Generasi Muda PAPISMA sesi 2026–2028.">
<meta name="theme-color" content="#1E6B3C" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141F19" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<script src="config.js"></script>
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GMP">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,400;1,6..72,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Susun atur: aplikasi telefon dahulu — bar atas melekat, kandungan satu lajur, navigasi bawah;
   ≥960px: rel sisi kiri + kandungan lebar. Identiti diwarisi daripada Sistem Kerja GMP (hijau jemaah + emas). */
:root{
  --ground:#F3F5F1; --surface:#FFFFFF; --surface-2:#EAEEE8; --surface-3:#E1E7DE;
  --ink:#16241C; --ink-2:#4A5A50; --ink-3:#6E7E74;
  --line:#D6DED3; --line-2:#C2CDBE;
  --green:#1E6B3C; --green-ink:#FFFFFF; --green-soft:#E2EFE6;
  --gold:#8F6806; --gold-soft:#F6ECD1;
  --ok:#2E7D4F; --warn:#A86F06; --crit:#A03A2E; --crit-soft:#F8E4E0; --info:#2B6E8F; --idle:#8A9990;
  --scrim:rgba(14,24,18,.42);
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --nav-h:62px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0D150F; --surface:#141F19; --surface-2:#1A2820; --surface-3:#22332A;
  --ink:#E7EFE7; --ink-2:#A6B7AB; --ink-3:#86978C;
  --line:#28382F; --line-2:#334539;
  --green:#5CBC80; --green-ink:#0B1710; --green-soft:#15301F;
  --gold:#D9AE4A; --gold-soft:#2C2513;
  --ok:#5CBC80; --warn:#D9AE4A; --crit:#E27D71; --crit-soft:#3A1E1A; --info:#6FB4D6; --idle:#6E7F75;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#0D150F; --surface:#141F19; --surface-2:#1A2820; --surface-3:#22332A;
  --ink:#E7EFE7; --ink-2:#A6B7AB; --ink-3:#86978C;
  --line:#28382F; --line-2:#334539;
  --green:#5CBC80; --green-ink:#0B1710; --green-soft:#15301F;
  --gold:#D9AE4A; --gold-soft:#2C2513;
  --ok:#5CBC80; --warn:#D9AE4A; --crit:#E27D71; --crit-soft:#3A1E1A; --info:#6FB4D6; --idle:#6E7F75;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ground)}
body{color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- bar atas ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:10px;padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;color:inherit}
.brand img{width:44px;height:auto;flex:none}
.brand b{display:block;font-weight:800;font-size:14px;letter-spacing:.01em;white-space:nowrap}
.brand span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--ink-3);white-space:nowrap}
.bar .kanan{margin-left:auto;display:flex;align-items:center;gap:6px}
.seg-pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;color:var(--ink-2);
  background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.seg-pill i{width:7px;height:7px;border-radius:50%;background:var(--idle);flex:none}
.seg-pill.sedia i{background:var(--ok)}.seg-pill.demo i{background:var(--gold)}
.seg-pill.luar i,.seg-pill.segerak i{background:var(--info)}.seg-pill.ralat i,.seg-pill.akses i{background:var(--crit)}
.seg-pill.segerak i{animation:denyut 1s infinite alternate}
@keyframes denyut{to{opacity:.25}}
.ikon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:none;border:0;cursor:pointer;color:var(--ink-2)}
.ikon-btn:hover{background:var(--surface-2)}
.ikon-btn svg{width:20px;height:20px}

/* ---------- navigasi ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:var(--nav-h);
  text-decoration:none;color:var(--ink-3);font-size:11px;font-weight:600;position:relative}
.nav a svg{width:22px;height:22px}
.nav a.on{color:var(--green)}
.nav a.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--green)}
.nav a .lencana{position:absolute;top:7px;left:calc(50% + 6px);font-family:var(--mono);font-size:9.5px;font-weight:600;
  background:var(--crit);color:#fff;border-radius:9px;padding:0 5px;line-height:16px;min-width:16px;text-align:center}
.rel{display:none}

/* ---------- kandungan ---------- */
main{padding-block:18px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.isi{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.kepala{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.kepala h1{font-family:var(--serif);font-weight:500;font-size:28px;letter-spacing:-.01em}
.kepala .sub{color:var(--ink-2);font-size:14px;margin-top:2px}
.kepala .tindak{margin-left:auto;display:flex;gap:8px}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.blok{display:flex;flex-direction:column;gap:10px}
.blok>h2{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.blok>h2 .kira{font-family:var(--mono);font-weight:500;color:var(--ink-3);letter-spacing:0}
.blok>h2 a{margin-left:auto;font-size:12px;letter-spacing:0;text-transform:none;color:var(--green);font-weight:600;text-decoration:none}

.kad{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kosong{padding:26px 18px;text-align:center;color:var(--ink-3);font-size:14px;border:1px dashed var(--line-2);border-radius:10px}
.kosong b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:4px}
.nota{font-size:13px;color:var(--ink-3)}
.amaran{border-left:3px solid var(--warn);background:var(--gold-soft);padding:11px 14px;border-radius:0 8px 8px 0;font-size:13.5px;color:var(--ink-2);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.amaran.bahaya{border-color:var(--crit);background:var(--crit-soft)}
.amaran .btn{margin-left:auto}

/* sambutan */
.sambut{display:flex;flex-direction:column;gap:12px}
.sambut h1{font-family:var(--serif);font-weight:500;font-size:30px;letter-spacing:-.015em}
.sambut h1 em{font-style:italic;color:var(--green)}
.sesi{display:flex;flex-direction:column;gap:6px}
.sesi .baris{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.fasa-trek{display:grid;grid-template-columns:6fr 6fr 6fr 6fr 3fr;gap:3px}
.fasa-trek span{height:8px;border-radius:2px;background:var(--surface-3);position:relative;overflow:hidden}
.fasa-trek span b{position:absolute;inset:0 auto 0 0;background:var(--green);border-radius:2px}
.fasa-label{display:grid;grid-template-columns:6fr 6fr 6fr 6fr 3fr;gap:3px;font-family:var(--mono);font-size:9.5px;color:var(--ink-3)}
.fasa-label .on{color:var(--green);font-weight:600}

.jubin{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.jubin a{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.jubin .n{font-family:var(--mono);font-size:28px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.jubin .l{font-size:12px;color:var(--ink-2);font-weight:600;line-height:1.3}
.jubin a.crit .n{color:var(--crit)}.jubin a.crit{border-color:var(--crit)}
.jubin a.warn .n{color:var(--warn)}

/* ---------- butang & kawalan ---------- */
.btn{font-weight:600;font-size:13.5px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  padding:9px 14px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;text-decoration:none;min-height:40px}
.btn:hover{border-color:var(--ink-3)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.utama{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn.bahaya{color:var(--crit);border-color:var(--crit);background:transparent}
.btn.bahaya.sah{background:var(--crit);color:#fff}
.btn.kecil{font-size:12px;padding:5px 10px;min-height:32px}
.btn svg{width:16px;height:16px}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));z-index:54;
  height:52px;padding:0 20px 0 16px;border-radius:26px;border:0;background:var(--green);color:var(--green-ink);font-weight:700;font-size:14.5px;
  display:flex;align-items:center;gap:8px;cursor:pointer;box-shadow:0 6px 18px rgba(14,40,24,.28)}
.fab svg{width:20px;height:20px}

.medan{display:flex;flex-direction:column;gap:5px;min-width:0}
.medan label,.label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
input[type=text],input[type=email],input[type=tel],input[type=url],input[type=date],input[type=number],input[type=search],input[type=password],select,textarea{
  width:100%;font-size:16px;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:9px 11px;color:var(--ink);min-height:42px}
textarea{min-height:90px;resize:vertical;font-family:var(--serif);font-size:16px;line-height:1.45}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.suis{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-weight:600;font-size:14px}
.suis:last-child{border-bottom:0}
.suis input{width:22px;height:22px;accent-color:var(--green);flex:none}

.cip-baris{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.cip-baris::-webkit-scrollbar{display:none}
.cip{flex:none;font-size:13px;font-weight:600;padding:7px 12px;border-radius:18px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);cursor:pointer;white-space:nowrap}
.cip.on{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.segmen{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.segmen button,.segmen label{border:0;background:none;padding:8px 6px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--ink-2);cursor:pointer;text-align:center}
.segmen button.on,.segmen input:checked+span{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.segmen label{padding:0}.segmen label span{display:block;padding:8px 6px;border-radius:8px}
.segmen input{position:absolute;opacity:0;pointer-events:none}
.penapis{display:flex;flex-direction:column;gap:10px}
.penapis .baris{display:flex;gap:8px}
.penapis .baris>*{flex:1;min-width:0}

/* ---------- tugasan ---------- */
.senarai{display:flex;flex-direction:column;gap:6px}
.tg{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px 10px 10px;cursor:pointer}
.tg:hover{border-color:var(--line-2)}
.tg.lewat{border-left:3px solid var(--crit)}
.tg.hampir{border-left:3px solid var(--warn)}
.tg.sekat{border-left:3px solid var(--ink-3)}
.tg.siap .tg-t{text-decoration:line-through;color:var(--ink-3)}
.cek{width:30px;height:30px;border-radius:50%;border:2px solid var(--line-2);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:transparent;padding:0}
.cek svg{width:16px;height:16px}
.cek:hover{border-color:var(--green);color:var(--green)}
.tg.siap .cek{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.tg-t{font-weight:600;font-size:14.5px;line-height:1.35}
.tg-m{display:flex;gap:4px 10px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);margin-top:3px}
.kod{font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--gold);background:var(--gold-soft);padding:0 5px;border-radius:3px}
.baki{font-family:var(--mono);font-size:11px;font-weight:600;white-space:nowrap;color:var(--ink-3);text-align:right}
.baki.lewat{color:var(--crit)}.baki.hampir{color:var(--warn)}
.status{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;color:var(--ink-2);white-space:nowrap}
.status i{width:7px;height:7px;border-radius:50%;background:var(--idle)}
.status.buat i,.status.sedia i,.status.jalan i{background:var(--warn)}
.status.siap i,.status.selesai i{background:var(--ok)}
.status.sekat i,.status.batal i{background:var(--crit)}
.status.rancang i{background:var(--info)}
.status.tangguh i{background:var(--ink-3)}
details.lipat summary{cursor:pointer;font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);padding:6px 0;list-style:none}
details.lipat summary::before{content:"▸ ";}
details.lipat[open] summary::before{content:"▾ ";}

.papan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,82%);gap:10px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.lajur{background:var(--surface-2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;scroll-snap-align:start;min-width:0}
.lajur h3{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px;padding:2px 4px 4px}
.lajur h3 .num{margin-left:auto;color:var(--ink-3);font-size:11px}
.lajur .tg{grid-template-columns:minmax(0,1fr)}
.lajur .tg .cek{display:none}

/* ---------- program ---------- */
.fasa-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-top:6px}
.fasa-h b{font-family:var(--mono);font-size:12px;color:var(--green);font-weight:600}
.fasa-h span{font-weight:700;font-size:15px}
.fasa-h em{font-style:normal;font-size:12px;color:var(--ink-3);margin-left:auto}
.prog{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;text-align:left;width:100%}
.prog:hover{border-color:var(--line-2)}
.prog .tkh{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;background:var(--surface-2);padding:6px 0;line-height:1.1}
.prog .tkh b{font-size:15px;font-weight:800}
.prog .tkh span{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.prog.kini .tkh{background:var(--green);color:var(--green-ink)}
.prog.kini .tkh span{color:inherit;opacity:.8}
.prog h3{font-size:14.5px;font-weight:700;line-height:1.3}
.prog .meta{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);margin-top:4px;align-items:center}
.trek{display:block;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin-top:8px}
.trek b{display:block;height:100%;background:var(--green);border-radius:3px}
.trek.emas b{background:var(--gold)}
.teras{font-family:var(--mono);font-size:10px;font-weight:600;padding:0 5px;border-radius:3px;border:1px solid var(--line-2);color:var(--ink-2)}

/* ---------- KPI ---------- */
.kpi{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;text-align:left;width:100%}
.kpi .k{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink-3)}
.kpi h3{font-size:14px;font-weight:600;line-height:1.3}
.kpi .v{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .v b{font-size:18px;font-weight:600}
.kpi .v span{display:block;font-size:10.5px;color:var(--ink-3)}
.kpi .auto{font-family:var(--mono);font-size:9.5px;color:var(--info);letter-spacing:.04em}
.kpi.capai .v b{color:var(--ok)}

/* ---------- negeri ---------- */
.ng{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;text-align:left;width:100%}
.ng h3{font-size:14.5px;font-weight:700}
.ng .ketua{font-size:12.5px;color:var(--ink-3);margin-top:1px}
.ng .tanda{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.tanda span{white-space:nowrap;font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:10px;border:1px solid var(--line);color:var(--ink-3)}
.tanda span.ya{border-color:var(--green);color:var(--green);background:var(--green-soft)}
.ng .data{text-align:right;font-family:var(--mono);font-size:12px;color:var(--ink-2);white-space:nowrap}
.ng .data b{display:block;font-size:17px;color:var(--ink);font-weight:600}

/* ---------- ahli ---------- */
.ahli{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.inisial{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--green-soft);color:var(--green);font-weight:800;font-size:14px}
.ahli h3{font-size:14px;font-weight:700;line-height:1.3}
.ahli .j{font-size:12px;color:var(--ink-3)}
.ahli .e{font-family:var(--mono);font-size:11px;color:var(--ink-2);overflow-wrap:anywhere}
.ahli .e.tiada{color:var(--crit)}
.ahli .tb{display:flex;gap:4px}

/* ---------- menu lagi ---------- */
.menu{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.menu a{display:flex;align-items:center;gap:14px;padding:14px 16px;text-decoration:none;color:inherit;border-bottom:1px solid var(--line)}
.menu a:last-child{border-bottom:0}

function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function p2(n){return (n<10?"0":"")+n;}
function num(v){var n=parseFloat(String(v==null?"":v).replace(/,/g,""));return isNaN(n)?0:n;}
function ya(v){return v===true||v==="ya"||v==="true"||v==="1";}
function rm(n){return "RM "+Math.round(num(n)).toLocaleString("en-MY");}
function hariIni(){var d=new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());}
function bulanIni(){return hariIni().slice(0,7);}
function bulanSebelum(b){var p=b.split("-"),y=+p[0],m=+p[1]-1;if(m<1){m=12;y--;}return y+"-"+p2(m);}
function bulanSelepas(b){var p=b.split("-"),y=+p[0],m=+p[1]+1;if(m>12){m=1;y++;}return y+"-"+p2(m);}
function bulanLepas(){return bulanSebelum(bulanIni());}
function hariKe(iso){var t=Date.parse(String(iso).slice(0,10)+"T00:00:00Z");return isNaN(t)?null:Math.round(t/864e5);}
function beza(iso){if(!iso)return null;var a=hariKe(iso);return a===null?null:a-hariKe(hariIni());}
function tambahHari(iso,n){var d=new Date(iso+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function fmtTarikh(iso){if(!iso||!/^\d{4}-\d{2}-\d{2}/.test(iso))return "Tiada tarikh";var p=iso.split("-");return parseInt(p[2],10)+" "+BULAN[+p[1]-1]+" "+p[0];}
function fmtBulan(b){if(!b)return "—";var p=b.split("-");return BULAN[+p[1]-1]+" "+p[0];}
function fmtBulanP(b){if(!b)return "—";var p=b.split("-");return BULAN_P[+p[1]-1]+" "+p[0];}
function tarikhProgram(p){return (p.bulan||FASA[0].d)+"-15";}
function tarikhAkhirLap(b){return bulanSelepas(b)+"-07";}
function bakiTeks(b){if(b===null)return "";if(b<0)return "lewat "+(-b)+" hari";if(b===0)return "hari ini";if(b===1)return "esok";return b+" hari lagi";}
function laluTeks(b){if(b===null)return "";if(b===0)return "hari ini";if(b===1)return "semalam";return b+" hari lalu";}
function bakiKelas(b){if(b===null)return "";if(b<0)return "lewat";if(b<=7)return "hampir";return "";}
function uid(p){return p+"-"+Date.now().toString(36)+Math.floor(Math.random()*46656).toString(36);}
function kini(){return new Date().toISOString();}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function urut(a,b){return num(a.urutan)-num(b.urutan);}
function ikutTarikhTurun(a,b){return (b.tarikh||"")<(a.tarikh||"")?-1:(b.tarikh||"")>(a.tarikh||"")?1:0;}
function inisial(s){s=String(s||"?").replace(/^(Ketua GMP|Ketua Jabatan)\s+/,"").trim().split(/\s+/);return ((s[0]||"?")[0]+((s[1]||"")[0]||"")).toUpperCase();}

function cari(jenis,id){for(var i=0;i<DATA[jenis].length;i++)if(DATA[jenis][i].id===id)return DATA[jenis][i];return null;}

function cariPemilik(id){
  var o=cari("orang",id); if(o) return {nama:o.nama, label:o.nama||o.jawatan, panjang:o.nama?o.nama+" ("+o.jawatan+")":o.jawatan, emel:o.emel, jawatan:o.jawatan};

function lengkapTugas(t){
  var o=cariPemilik(t.pemilik);
  t.pemilikNama = o? o.panjang : (t.pemilikNama||"");
  t.emel = o? (o.emel||"") : (t.emel||"");
  var p=cari("program",t.kod);
  if(p){ t.program=p.nama; if(!t.teras) t.teras=p.teras; }
  return t;
}

function gunaOp(data,op){
  var arr=data[op.jenis]; if(!arr)return;
  var id = op.op==="padam"? op.id : op.rekod.id;
  var i=-1; for(var k=0;k<arr.length;k++) if(arr[k].id===id){i=k;break;}
  if(op.op==="padam"){ if(i>=0) arr.splice(i,1); }
  else if(i>=0) arr[i]=Object.assign({},arr[i],op.rekod);
  else arr.push(Object.assign({},op.rekod));
}

function laksana(ops, mesej){
  ops.forEach(function(op){
    if(op.op==="simpan"){
      op.rekod=Object.assign({},op.rekod,{dikemaskini:kini()});
      if(op.jenis==="tugas") lengkapTugas(op.rekod);
    }
    gunaOp(DATA,op);
    if(CFG.url){
      var id=op.op==="padam"?op.id:op.rekod.id;
      OUTBOX=OUTBOX.filter(function(x){return !(x.jenis===op.jenis && (x.op==="padam"?x.id:x.rekod.id)===id);});
      OUTBOX.push(op);
    }
  });
  if(ops.some(function(o){return o.jenis==="orang"||o.jenis==="ajk";})) DATA.tugas.forEach(lengkapTugas);
  simpanLokal(); render();
  if(mesej) toast(mesej);
  jadualSegerak();
}

/* Cermin peraturan pelayan (Code.gs → HAK_NEGERI) untuk paparan butang. Pelayan tetap menjadi penentu. */
function bolehUbah(jenis,r){
  if(isMT()) return true;
  var ng=ngSaya();
  if(!r) return ["aktiviti","ajk","tugas","lapbulan"].indexOf(jenis)>=0;
  switch(jenis){
    case "negeri": case "orang": return r.id===ng;
    case "aktiviti": case "ajk": return r.negeri===ng;
    case "tugas": return r.negeri===ng || r.pemilik===ng;
    case "lapbulan": return r.negeri===ng && r.status!=="lulus";
    default: return false;
  }
}

function api(tindakan,tambahan,url,kod){
  var badan = Object.assign({kod:kod!=null?kod:CFG.kod,tindakan:tindakan},CFG.token&&kod==null?{token:CFG.token}:{},tambahan||{});
  if(GAS) return new Promise(function(lulus,gagal){
    var t=setTimeout(function(){ gagal(new Error("Tiada jawapan daripada pelayan (60 saat)")); },60000);
    google.script.run
      .withSuccessHandler(function(j){ clearTimeout(t); if(!j||!j.ok){ var e=new Error(j&&j.ralat||"Ralat pelayan"); e.kod=j&&j.kodRalat; gagal(e); } else lulus(j); })
      .withFailureHandler(function(e){ clearTimeout(t); gagal(new Error(navigator.onLine? "Pelayan Apps Script gagal: "+(e&&e.message||e) : "Tiada sambungan internet")); })
      .apiWeb(badan);
  });
  var ctrl = window.AbortController? new AbortController():null;
  var t = setTimeout(function(){ if(ctrl) ctrl.abort(); }, 45000);
  return fetch(url||CFG.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(badan),
      redirect:"follow",signal:ctrl?ctrl.signal:undefined})
    .then(function(r){ if(!r.ok) throw new Error("Pelayan membalas dengan kod HTTP "+r.status); return r.json(); })
    .then(function(j){ clearTimeout(t); if(!j.ok){ var e=new Error(j.ralat||"Ralat pelayan"); e.kod=j.kodRalat; throw e; } return j; },
          function(e){ clearTimeout(t); if(e&&e.name==="AbortError") e=new Error("Tiada jawapan daripada pelayan (45 saat)"); else if(e instanceof TypeError) e=new Error("Tidak dapat menghubungi Google. Semak URL /exec dan sambungan internet."); throw e; });
}
var sedang=null, pemasa=null;
function jadualSegerak(){ if(!CFG.url) return; clearTimeout(pemasa); pemasa=setTimeout(segerak,900); }
function segerak(){
  if(!CFG.url){ SEG.status="demo"; kemasStatus(); return Promise.resolve(); }
  if(!navigator.onLine){ SEG.status="luar"; kemasStatus(); return Promise.resolve(); }
  if(sedang){ SEG.ulang=true; return sedang; }
  SEG.status="segerak"; kemasStatus();
  var hantar = OUTBOX.slice(0,400);
  var p = hantar.length? api("pukal",{ops:hantar}) : api("semua");
  sedang = p.then(function(j){
    OUTBOX = OUTBOX.slice(hantar.length);
    var gagal = (j.hasil||[]).filter(function(h){return !h.ok;});
    if(j.akses){ CFG.peranan=j.akses.peranan; CFG.negeri=j.akses.negeri||""; simpanCfg(); }
    terimaData(j.data);
    if(CFG.akaun){ var me=cari("ahli",CFG.akaun.id); if(me){ CFG.akaun=me; if(me.jawatanId) CFG.saya=me.jawatanId; simpanCfg(); } }
    META.masa=j.masa; META.kosong=!(j.data.orang||[]).length;
    simpanLokal();
    SEG.status="sedia"; SEG.ralat = gagal.length? gagal.length+" perubahan ditolak: "+gagal[0].ralat : "";
    render(true);
    if(gagal.length) toast("Ditolak pelayan: "+gagal[0].ralat);
  }, function(e){
    if(CFG.url && /^(AKSES|MENUNGGU|DITOLAK|TIADA_PROFIL|SAHKAN)$/.test(e.kod||"")){ bersihSesi(); keluarFirebase(); UI_MASUK="masuk"; NOTIS_MASUK=e.message; render(); return; }
    SEG.status = e.kod==="AKSES"? "akses" : (navigator.onLine? "ralat" : "luar");
    SEG.ralat = e.message; kemasStatus();
    if(laluan()==="tetapan") render();
  }).then(function(){
    sedang=null;
    if(SEG.status==="sedia" && (SEG.ulang || OUTBOX.length)){ SEG.ulang=false; return segerak(); }
    SEG.ulang=false;
  });
  return sedang;
}
function terimaData(d){
  var baru={};
  JENIS.forEach(function(j){ baru[j]=Array.isArray(d[j])? d[j] : []; });
  OUTBOX.forEach(function(op){ gunaOp(baru,op); });
  DATA=baru;
}
function kemasStatus(){
  var pill=$("#segPill"), t=$("#segTeks");
  var tunggu = OUTBOX.length? " · "+OUTBOX.length+" menunggu" : "";
  var teks = {
    demo:"Belum log masuk",
    sedia: META.masa? "Dimuat semula "+new Date(META.masa).toLocaleTimeString("ms-MY",{hour:"2-digit",minute:"2-digit"})+tunggu : "Tersambung"+tunggu,

function janaTugasan(p, langkauLepas){
  if(!p) return [];
  var asas=tarikhProgram(p), hari=hariIni(), out=[];
  var adaOrang=function(id){return !!cari("orang",id);};
  TEMPLAT.forEach(function(t,i){
    var tarikh=tambahHari(asas,t[0]*7);
    if(langkauLepas && tarikh<hari) return;
    var pemilik = t[2]==="*"? p.peneraju : t[2];
    if(!adaOrang(pemilik)) pemilik = adaOrang(p.peneraju)? p.peneraju : "suk";
    out.push({id:p.id+"-L"+p2(i+1),kod:p.id,program:p.nama,tajuk:t[1],teras:p.teras,pemilik:pemilik,pemilikNama:"",emel:"",
      tarikh:tarikh,status:"belum",catatan:"",auto:"ya",negeri:"",dikemaskini:kini()});
  });
  return out;
}
function kiraTugas(arr){
  var r={lewat:0,hampir:0,sekat:0,aktif:0,siap:0};
  arr.forEach(function(t){
    if(t.status==="siap"){r.siap++;return;}
    r.aktif++;
    if(t.status==="sekat") r.sekat++;
    var b=beza(t.tarikh);
    if(b!==null && b<0) r.lewat++; else if(b!==null && b<=7) r.hampir++;
  });
  return r;
}
function tugasSkop(){
  if(!isMT()){ var ng=ngSaya(); return DATA.tugas.filter(function(t){return t.negeri===ng || t.pemilik===ng;}); }
  return DATA.tugas.filter(function(t){return !t.negeri || UI.dalamNg;});
}
function tugasSaya(){
  if(!isMT()) return tugasSkop();
  return DATA.tugas.filter(function(t){return CFG.saya && t.pemilik===CFG.saya;});
}
function aktivitiNegeri(ng){ return DATA.aktiviti.filter(function(a){return a.negeri===ng && a.tarikh<=hariIni();}).sort(ikutTarikhTurun); }
function lapNegeri(ng,b){ return cari("lapbulan","lb-"+ng+"-"+b); }
function aktif60(ng){ var a=aktivitiNegeri(ng)[0]; return !!a && -beza(a.tarikh)<=60; }

function skorNegeri(n){
  var o=cari("orang",n.id), akt=aktivitiNegeri(n.id)[0], hariAkt=akt? -beza(akt.tarikh) : null;
  var lb=lapNegeri(n.id,bulanLepas()), r=num(n.rekod), d=num(n.dipindah);
  var item=[
    {k:"Struktur lengkap (Ketua + AJK)",m:20,ok:ya(n.struktur),ke:"data"},
    {k:"Nama Ketua GMP negeri diisi",m:10,ok:!!(o&&o.nama),ke:"ajk"},
    {k:"Roadshow GMP selesai",m:15,ok:ya(n.roadshow),ke:""},
    {k:"Aktiviti cawangan dalam 60 hari",m:20,ok:hariAkt!==null&&hariAkt<=60,ke:"aktiviti",m2:hariAkt!==null?"terakhir "+laluTeks(hariAkt):"tiada rekod"},
    {k:"Laporan "+fmtBulan(bulanLepas())+" dihantar",m:15,ok:!!lb&&(lb.status==="dihantar"||lb.status==="lulus"),ke:"lapbulan",m2:lb?ST_LAP[lb.status]:"belum"},
    {k:"Rekod graduan dikumpul",m:10,ok:r>0,ke:"data",m2:r?r+" rekod":""},
    {k:"Pemindahan data ≥70%",m:10,ok:r>0&&d/r>=0.7,ke:"data",m2:r?Math.round(d/r*100)+"%":""}
  ];
  return {skor:item.reduce(function(a,x){return a+(x.ok?x.m:0);},0),item:item};
}
function kedudukanNegeri(){
  return DATA.negeri.map(function(n){return {n:n,s:skorNegeri(n)};})
    .sort(function(a,b){return b.s.skor-a.s.skor || urut(a.n,b.n);});
}
function cincin(skor,kecil){
  var k=skor<40?" rendah":skor<70?" sederhana":"";
  return '<span class="cincin'+(kecil?" kecil":"")+k+'" style="--p:'+skor+'" role="img" aria-label="Skor '+skor+' daripada 100"><span>'+skor+'</span></span>';
}
function statMesyuarat(){
  var m=DATA.mesyuarat.filter(function(x){return x.jenis==="maya" && x.tarikh<=hariIni();});
  var pct=m.map(function(x){var j=senaraiId(x.jemputan).length;return j? senaraiId(x.hadir).length/j*100 : null;}).filter(function(x){return x!==null;});
  return {bil:m.length, purata: pct.length? Math.round(pct.reduce(function(a,b){return a+b;},0)/pct.length) : 0};
}
function nilaiKpi(k){
  var n=DATA.negeri, s=function(f){return n.reduce(function(a,x){return a+num(x[f]);},0);},
      c=function(f){return n.filter(function(x){return ya(x[f]);}).length;};
  switch(k.id){
    case "K01": return s("rekod");
    case "K02": return c("struktur");
    case "K03": return c("roadshow");
    case "K04": var r=s("rekod"); return r? Math.round(s("dipindah")/r*100) : 0;
    case "K06": var a=cari("program","P08"), b=cari("program","P16"); return num(a&&a.peserta)+num(b&&b.peserta);
    case "K07": return statMesyuarat().bil;
    case "K08": return statMesyuarat().purata;
    case "K09": return n.filter(function(x){return aktif60(x.id);}).length;
    default: return num(k.semasa);
  }
}
function fasaKini(){ var b=bulanIni(); for(var i=0;i<FASA.length;i++) if(b>=FASA[i].d && b<=FASA[i].h) return i; return b<FASA[0].d? -1 : FASA.length; }
function fasaProgram(p){ for(var i=0;i<FASA.length;i++) if(p.bulan>=FASA[i].d && p.bulan<=FASA[i].h) return i; return FASA.length-1; }
function laporanTertunggak(){
  var ada={}; DATA.laporan.forEach(function(l){ada[l.kod]=true;});
  return DATA.program.filter(function(p){
    if(ada[p.id] || p.status==="batal" || p.status==="tangguh") return false;
    var b=beza(tambahHari(tarikhProgram(p),14)); return b!==null && b<0;
  }).sort(urut);
}
function perluTindakanNg(){
  var ng=ngSaya(), bl=bulanLepas(), lb=lapNegeri(ng,bl);
  if(lb && lb.status==="pembetulan") return 1;
  if((!lb || lb.status==="draf") && hariIni()>tarikhAkhirLap(bl)) return 1;
  return 0;
}

HAL.tugas = function(){

  var h = '<div class="kepala"><div><h1>Tugasan</h1><div class="sub">'+(mt?skop.length+' tugasan · '+kiraTugas(skop).siap+' selesai':'Tugasan dalaman '+esc(namaNegeri(ngSaya()))+' & tugasan daripada Pusat')+'</div></div></div>'+
    '<div class="penapis"><div class="segmen" role="tablist">'+mods.map(function(m){return '<button type="button" role="tab" data-act="mod" data-mod="'+m[0]+'" class="'+(UI.mod===m[0]?"on":"")+'" aria-selected="'+(UI.mod===m[0])+'">'+m[1]+'</button>';}).join("")+
    '</div><div class="baris">'+pilihProg+'<input type="search" id="fCari" placeholder="Cari tugasan" value="'+esc(UI.cari)+'" aria-label="Cari tugasan"></div>'+
    (mt?'<label class="suis" style="border:0;padding:0;font-size:13px;font-weight:500;color:var(--ink-2)">Tunjuk tugasan dalaman negeri<input type="checkbox" id="fDalamNg"'+(UI.dalamNg?" checked":"")+'></label>':'')+'</div>';
  var arr = skop.filter(function(t){
    if(mt && UI.mod==="saya" && t.pemilik!==CFG.saya) return false;
    if(mt && UI.prog==="-" && t.kod) return false;
    if(mt && UI.prog && UI.prog!=="-" && t.kod!==UI.prog) return false;
    if(UI.cari){ var q=UI.cari.toLowerCase(); if((t.tajuk+" "+t.program+" "+t.pemilikNama+" "+t.kod).toLowerCase().indexOf(q)<0) return false; }
    return true;
  }).sort(function(a,b){return (a.tarikh||"9999")<(b.tarikh||"9999")?-1:(a.tarikh||"9999")>(b.tarikh||"9999")?1:0;});
  if(mt && UI.mod==="saya" && !CFG.saya){
    return h+'<div class="kad blok"><b>Siapa anda?</b><p class="nota">Pilih jawatan anda sekali sahaja untuk melihat tugasan sendiri. Disimpan dalam peranti ini.</p>'+
      pilihOrang("pilihSaya","")+'<button class="btn utama" data-act="tetap-saya" type="button">Simpan</button></div>';
  }
  if(!skop.length) return h+kosong("Belum ada tugasan", mt? 'Buka program di halaman Program dan tekan "Jana tugasan", atau tambah tugasan sendiri.' : 'Tekan "Tugasan" untuk mengagihkan kerja kepada AJK negeri.');
  if(UI.mod==="papan"){
    return h+'<div class="papan">'+["belum","buat","sekat","siap"].map(function(s){
      var x=arr.filter(function(t){return (t.status||"belum")===s;});
      return '<div class="lajur"><h3><span class="status '+s+'"><i></i></span>'+ST_TUGAS[s]+'<span class="num">'+x.length+'</span></h3>'+(x.length? x.map(itemTugas).join("") : '<p class="nota" style="padding:4px">Tiada</p>')+'</div>';
    }).join("")+'</div>';
  }
  var g={lewat:[],minggu:[],datang:[],tiada:[],siap:[]};
  arr.forEach(function(t){
    if(t.status==="siap") return g.siap.push(t);
    var b=beza(t.tarikh); if(b===null) g.tiada.push(t); else if(b<0) g.lewat.push(t); else if(b<=7) g.minggu.push(t); else g.datang.push(t);
  });
  var badan = kumpulan("Lewat",g.lewat,itemTugas)+kumpulan("7 hari akan datang",g.minggu,itemTugas)+kumpulan("Akan datang",g.datang.slice(0,60),itemTugas)+
    kumpulan("Tiada tarikh",g.tiada,itemTugas)+
    (g.siap.length? '<details class="lipat"><summary>Selesai · '+g.siap.length+'</summary><div class="senarai">'+g.siap.slice(-40).reverse().map(itemTugas).join("")+'</div></details>' : "");
  return h+(badan || kosong("Tiada tugasan sepadan","Ubah penapis untuk melihat lebih banyak."));
};

/* ---------- Leaflet (dimuat hanya bila peta dibuka) ---------- */
var JANJI_LEAFLET=null;
function muatLeaflet(){
  if(window.L) return Promise.resolve(window.L);
  if(JANJI_LEAFLET) return JANJI_LEAFLET;
  JANJI_LEAFLET=new Promise(function(ok,gagal){
    var c=document.createElement("link"); c.rel="stylesheet"; c.href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"; document.head.appendChild(c);
    var s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js";
    s.onload=function(){ ok(window.L); };
    s.onerror=function(){ JANJI_LEAFLET=null; gagal(new Error("Peta tidak dapat dimuatkan. Semak sambungan internet.")); };
    document.head.appendChild(s);
  });
  return JANJI_LEAFLET;
}
function lapisanPeta(L,peta){
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:17,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'}).addTo(peta);
}
function warnaToken(n){ try{ return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||"#1E6B3C"; }catch(e){ return "#1E6B3C"; } }
function bundar(v){ var n=parseFloat(v); return isNaN(n)?"":String(Math.round(n*100)/100); }

/* Pemilih lokasi: borang daftar & profil. Medan tersembunyi iLat/iLng. */
var PEMILIH=null;
function pasangPemilih(idDiv){
  var div=document.getElementById(idDiv); if(!div) return;
  muatLeaflet().then(function(L){
    if(!document.body.contains(div)) return;
    if(PEMILIH){ try{ PEMILIH.peta.remove(); }catch(e){} PEMILIH=null; }
    var lat=parseFloat(v("iLat")), lng=parseFloat(v("iLng")), ng=v("iNegeriD")||v("iNegeriP");
    var pusat = !isNaN(lat)? [lat,lng] : (PUSAT_NEGERI[ng]||[4.2,108]);
    var peta=L.map(div,{scrollWheelZoom:false}).setView(pusat, !isNaN(lat)?12:(PUSAT_NEGERI[ng]?9:5));
    lapisanPeta(L,peta);
    var penanda=null;
    var letak=function(a,b,gerak){
      a=Math.round(a*100)/100; b=Math.round(b*100)/100;
      document.getElementById("iLat").value=a; document.getElementById("iLng").value=b;
      if(penanda) penanda.setLatLng([a,b]);
      else penanda=L.circle([a,b],{radius:700,color:warnaToken("--green"),weight:2,fillOpacity:.25}).addTo(peta);
      if(gerak) peta.setView([a,b],13);
      var t=document.getElementById("teksLokasi"); if(t) t.innerHTML='Kawasan ditanda: <b class="num">'+a.toFixed(2)+', '+b.toFixed(2)+'</b> (±1 km)';
    };
    if(!isNaN(lat)) letak(lat,lng,false);
    peta.on("click",function(e){ letak(e.latlng.lat,e.latlng.lng,false); });
    PEMILIH={peta:peta,letak:letak};
    setTimeout(function(){ peta.invalidateSize(); },150);
  }).catch(function(e){ div.innerHTML='<p class="nota" style="padding:16px">'+esc(e.message)+'</p>'; });
}

    '<input type="hidden" id="iLat" value="'+esc(a.lat||"")+'"><input type="hidden" id="iLng" value="'+esc(a.lng||"")+'">'+
    '<div class="baris-lokasi"><span id="teksLokasi" class="nota">'+(a.lat?'Kawasan ditanda: <b class="num">'+esc(a.lat)+', '+esc(a.lng)+'</b> (±1 km)':'Tekan pada peta untuk menanda kawasan anda.')+'</span>'+
    '<button class="btn kecil" type="button" data-act="lokasi-saya">Guna lokasi semasa</button></div>'+
    '<p class="nota">Lokasi dibundarkan kepada ±1 km sebelum disimpan. Tanda kawasan tempat kerja atau pengajian; alamat rumah tidak diperlukan.</p></div>';
}

function urlUntukMasuk(){
  var u=apiUrl(); if(!u){ var i=v("iApi"); if(i){ if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(i)){ toast(/\/library\//.test(i)? "Ini URL Library, bukan Aplikasi web. Apps Script → Terapkan → Penerapan baharu → jenis: Aplikasi web, kemudian salin URL /exec." : "URL pelayan mesti bermula https://script.google.com/ dan berakhir /exec"); return null; } CFG.api=i; simpanCfg(); u=i; } }

}

var PETA_AHLI=null;
function lukisPetaAhli(){
  var div=document.getElementById("petaAhli"); if(!div) return;
  muatLeaflet().then(function(L){
    if(!document.body.contains(div)) return;
    if(PETA_AHLI){ try{ PETA_AHLI.remove(); }catch(e){} }
    var peta=L.map(div,{scrollWheelZoom:false}).setView(UI.petaNg&&PUSAT_NEGERI[UI.petaNg]?PUSAT_NEGERI[UI.petaNg]:[4.2,108.5], UI.petaNg?8:5);
    PETA_AHLI=peta; lapisanPeta(L,peta);
    var ng=UI.petaNg||"", pr=UI.petaPeranan||"", kump={};
    DATA.ahli.forEach(function(a){
      if(a.statusAkaun!=="aktif"||!a.lat||!a.lng) return;
      if((ng&&a.negeri!==ng)||(pr&&a.peranan!==pr)) return;
      var k=a.lat+","+a.lng; (kump[k]=kump[k]||[]).push(a);
    });
    var hijau=warnaToken("--green"), emas=warnaToken("--gold"), titik=[];
    Object.keys(kump).forEach(function(k){
      var g=kump[k], p=k.split(",").map(Number), adaMT=g.some(function(a){return a.peranan==="mt";});
      titik.push(p);
      var m=L.circleMarker(p,{radius:Math.min(7+3*Math.sqrt(g.length-1),20),color:"#fff",weight:2,fillColor:adaMT?hijau:(g.some(function(a){return a.peranan==="negeri";})?emas:warnaToken("--info")),fillOpacity:.9}).addTo(peta);
      m.bindPopup('<div class="pop">'+g.map(function(a){
        var j=a.jawatanId&&cari("orang",a.jawatanId);
        return '<div><b>'+esc(a.nama)+'</b><br><span>'+esc(j?j.jawatan:PERANAN[a.peranan]||"")+'</span><br>'+
          esc([a.institusi,a.daerah,namaNegeri(a.negeri)].filter(Boolean).join(" · "))+'<br><span>'+esc([a.bidang,a.statusProf].filter(Boolean).join(" · "))+'</span>'+
          (a.telefon?'<br><span class="num">'+esc(a.telefon)+'</span>':'')+'</div>';
      }).join("<hr>")+'</div>',{maxWidth:260});
      if(g.length>1) m.bindTooltip(String(g.length),{permanent:true,direction:"center",className:"bil-titik"});
    });
    if(titik.length>1 && !UI.petaNg) peta.fitBounds(titik,{padding:[30,30],maxZoom:11});
    else if(titik.length && UI.petaNg) peta.fitBounds(titik.concat([PUSAT_NEGERI[UI.petaNg]||titik[0]]),{padding:[30,30],maxZoom:11});
    setTimeout(function(){ peta.invalidateSize(); },150);
  }).catch(function(e){ div.innerHTML='<p class="nota" style="padding:20px">'+esc(e.message)+'</p>'; });
}

function blokPelayan(){
  if(window.GMP_API_URL) return "";
  return '<details class="pelayan"'+(CFG.api?'':' open')+'><summary>Tetapan pelayan</summary>'+
    medan("iApi","URL aplikasi web Apps Script",'<input type="url" id="iApi" placeholder="https://script.google.com/macros/s/…/exec" value="'+esc(CFG.api||"")+'">')+
    '<p class="nota">Pentadbir boleh menetapkannya untuk semua dalam config.js.</p></details>';
}
var NOTIS_MASUK="";
function paparMasuk(){
  document.body.classList.add("log-masuk");
  $("#fab").hidden=true; $("#nav").innerHTML=""; $("#rel").innerHTML="";
  $("#brandNama").textContent="GMP Malaysia"; $("#brandSub").textContent="SESI 2026–2028";
  var pill=$("#segPill"); pill.className="seg-pill"; $("#segTeks").textContent="Belum log masuk";
  var ada=$("#masukMod"); if(ada && ada.getAttribute("data-mod")===UI_MASUK && !NOTIS_MASUK) return;
  var notis = NOTIS_MASUK? '<div class="amaran"><span>'+esc(NOTIS_MASUK)+'</span></div>' : ''; NOTIS_MASUK="";
  var tiadaFb = fbSedia()? '' : '<div class="amaran bahaya"><span><b>Firebase belum dikonfigurasi.</b> '+sebabConfig()+'</span></div>';
  var emelFb = FB&&FB.auth.currentUser? FB.auth.currentUser.email : "";
  var h, M=UI_MASUK;
  if(M==="daftar"){
    h='<section class="masuk" id="masukMod" data-mod="daftar">'+kepalaMasuk()+'<p class="sub">Langkah 1 daripada 3 · Cipta akaun</p>'+notis+tiadaFb+
      '<form class="kad blok" data-form="daftarAkaun">'+
        medan("iEmelD","E-mel",'<input type="email" id="iEmelD" required autocomplete="email">')+
        medan("iKataD","Kata laluan (minimum 8 aksara)",'<input type="password" id="iKataD" required minlength="8" autocomplete="new-password">')+
        medan("iKataD2","Sahkan kata laluan",'<input type="password" id="iKataD2" required minlength="8" autocomplete="new-password">')+
        blokPelayan()+
        '<button class="btn utama" type="submit">Cipta akaun</button>'+
        '<p class="nota">Selepas ini: sahkan e-mel → isi maklumat ahli → kelulusan Majlis Tertinggi.</p>'+
      '</form><button class="btn" type="button" data-act="masuk-mod" data-mod="masuk">Sudah ada akaun? Log masuk</button></section>';
  } else if(M==="sahkan"){
    h='<section class="masuk" id="masukMod" data-mod="sahkan">'+kepalaMasuk()+'<p class="sub">Langkah 2 daripada 3 · Sahkan e-mel</p>'+notis+
      '<div class="kad blok"><p style="font-size:14.5px">Pautan pengesahan telah dihantar ke <b>'+esc(emelFb)+'</b>. Buka e-mel itu dan klik pautan, kemudian kembali ke sini.</p>'+
      '<p class="nota">Tiada dalam peti masuk? Semak folder spam atau promosi.</p>'+
      '<button class="btn utama" type="button" data-act="fb-semak-sah">Saya sudah sahkan</button>'+
      '<button class="btn" type="button" data-act="fb-hantar-sah">Hantar semula e-mel</button></div>'+
      '<button class="pautan" type="button" data-act="fb-keluar">Guna e-mel lain</button></section>';
  } else if(M==="profil"){
    h='<section class="masuk lebar" id="masukMod" data-mod="profil">'+
      '<h1>Maklumat <em>ahli</em></h1><p class="sub">Langkah 3 daripada 3 · '+esc(emelFb)+'</p>'+notis+
      '<form class="kad blok" data-form="daftarProfil" id="fDaftar" novalidate>'+medanProfil({},true)+
        '<label class="setuju"><input type="checkbox" id="iSetuju" required><span>Saya bersetuju maklumat ini disimpan oleh Generasi Muda PAPISMA untuk pengurusan keahlian. Kawasan saya (±1 km), nama, institusi dan bidang dipaparkan kepada ahli berdaftar. Tarikh lahir, jantina dan alamat hanya dilihat oleh Majlis Tertinggi; telefon dan e-mel oleh Majlis Tertinggi dan AJK negeri saya.</span></label>'+
        '<button class="btn utama" type="submit">Hantar pendaftaran</button></form>'+
      '<button class="pautan" type="button" data-act="fb-keluar">Log keluar</button></section>';
  } else if(M==="lupa"){
    h='<section class="masuk" id="masukMod" data-mod="lupa">'+kepalaMasuk()+'<p class="sub">Tetapkan semula kata laluan</p>'+notis+
      '<form class="kad blok" data-form="lupaFb">'+medan("iEmelL","E-mel berdaftar",'<input type="email" id="iEmelL" required autocomplete="email" value="'+esc(EMEL_LUPA)+'">')+
      '<button class="btn utama" type="submit">Hantar pautan tetapan semula</button></form>'+
      '<button class="btn" type="button" data-act="masuk-mod" data-mod="masuk">Kembali ke log masuk</button></section>';
  } else if(M==="menunggu" || M==="ditolak"){

function iOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent); }
function standalone(){ return (window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone===true; }
function statusPush(){

function hidupkanPush(el){

}

}

BORANG.daftarUptaAwam = function(form, btn){
  if(v("iULaman")) { UPTA_SIAP={nama:"",mesej:"Pendaftaran diterima."}; render(); return false; }
  var perlu=[["iUNama","Isi nama penuh"],["iUEmel","Isi e-mel"],["iUTel","Isi nombor telefon"],["iULahir","Isi tarikh lahir"],["iUNgAsal","Pilih negeri asal"],["iUAlamat","Isi alamat"],["iUKampus","Isi kampus"],["iUJurusan","Isi jurusan"],["iUSem","Pilih semester"],["iULajnah","Pilih lajnah"]];
  for(var i=0;i<perlu.length;i++) if(!v(perlu[i][0])){ toast(perlu[i][1]); var el=document.getElementById(perlu[i][0]); if(el) el.focus(); return false; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v("iUEmel"))){ toast("E-mel tidak sah"); return false; }
  if(String(v("iUTel")).replace(/\D/g,"").length<9){ toast("Nombor telefon tidak sah"); return false; }
  if(/^\s*(usm|uitm|ukm|um|upm|iium|uiam)\s*$/i.test(v("iUKampus"))){ toast("Tulis nama kampus penuh, cth "+v("iUKampus").toUpperCase()+" Kubang Kerian"); return false; }
  if(!v("iUSetuju")){ toast("Sila tandakan persetujuan privasi"); return false; }
  var sejarah=lsGet("gmp.uptaHantar",[]).filter(function(t){return Date.now()-t<86400000;});
  if(sejarah.length>=5){ toast("Had pendaftaran dari peranti ini dicapai. Cuba esok."); return false; }
  var k=document.querySelector('input[name="iUKomit"]:checked');
  var rekod={nama:v("iUNama"),emel:v("iUEmel"),telefon:v("iUTel"),tarikhLahir:v("iULahir"),negeriAsal:v("iUNgAsal"),alamat:v("iUAlamat"),
    alamatSurat:v("iUSama")?v("iUAlamat"):(v("iUSurat")||v("iUAlamat")),kampus:v("iUKampus"),jurusan:v("iUJurusan"),semester:v("iUSem"),hospital:v("iUHospital"),
    jawatanJik:v("iUJawatan"),lajnah:v("iULajnah"),komitmen:k?k.value:"",baitulMuslim:v("iUBm"),bolehHubung:!!v("iUHubung"),persetujuan:true};
  var u=apiUrl(); if(!u){ toast("Borang belum disambungkan ke pelayan"); return false; }
  if(btn){ btn.disabled=true; btn.textContent="Menghantar…"; }
  hantarApi(u,{tindakan:"daftarUpta",rekod:rekod,laman:v("iULaman")}).then(function(j){
    sejarah.push(Date.now()); lsSet("gmp.uptaHantar",sejarah);
    UPTA_SIAP={nama:rekod.nama,mesej:j.mesej||"Pendaftaran diterima."}; render(); window.scrollTo(0,0);
  },function(e){ toast(e.message||"Gagal menghantar"); if(btn){ btn.disabled=false; btn.textContent="Hantar pendaftaran"; } });
  return false;
};

function toast(m,butang,fn){
  var t=$("#toast"); t.innerHTML="<span>"+esc(m)+"</span>"+(butang?'<button type="button">'+esc(butang)+'</button>':'');
  if(butang) t.querySelector("button").onclick=fn;
  t.classList.add("on"); clearTimeout(t._x); t._x=setTimeout(function(){t.classList.remove("on");}, butang?12000:2600);
}
function gunaTema(){
  var r=document.documentElement;
  if(CFG.tema==="light"||CFG.tema==="dark") r.setAttribute("data-theme",CFG.tema);
  else if(r.getAttribute("data-gmp-tema")) r.removeAttribute("data-theme");
  r.setAttribute("data-gmp-tema",CFG.tema);
}

/* ======================================================================
   PWA: service worker, pasang, luar talian
   ====================================================================== */
if(!GAS && "serviceWorker" in navigator && /^https:|^http:\/\/localhost/.test(location.href)){
  try{
    navigator.serviceWorker.register("sw.js").then(function(reg){
      var tawar=function(w){ toast("Versi baharu tersedia","Kemas kini",function(){ w.postMessage("LANGKAU_TUNGGU"); }); };
      if(reg.waiting && navigator.serviceWorker.controller) tawar(reg.waiting);
      reg.addEventListener("updatefound",function(){
        var w=reg.installing; if(!w) return;
        w.addEventListener("statechange",function(){ if(w.state==="installed" && navigator.serviceWorker.controller) tawar(w); });
      });
      setInterval(function(){ reg.update().catch(function(){}); }, 60*60*1000);
    }).catch(function(){});
    var dimuat=false, adaPengawal=!!navigator.serviceWorker.controller;
    // muat semula hanya apabila versi BAHARU mengambil alih (bukan pada pemasangan pertama)
    navigator.serviceWorker.addEventListener("controllerchange",function(){ if(!adaPengawal){ adaPengawal=true; return; } if(dimuat) return; dimuat=true; location.reload(); });
  }catch(e){}
}
